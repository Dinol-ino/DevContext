name: Ingest PR Decision

on:
  pull_request:
    types: [closed]

jobs:
  ingest:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DevContextIQ Ingestion Webhook
        env:
          INGESTION_WEBHOOK_URL: ${{ secrets.DEVCONTEXT_INGESTION_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEVCONTEXT_WEBHOOK_SECRET }}
        run: |
          if [ -z "$INGESTION_WEBHOOK_URL" ]; then
            echo "INGESTION_WEBHOOK_URL not configured. Skipping automated ingestion."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg body "${{ github.event.pull_request.body }}" \
            --arg url "${{ github.event.pull_request.html_url }}" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            '{
              action: "closed",
              pull_request: {
                merged: true,
                title: $title,
                body: $body,
                html_url: $url,
                user: { login: $author },
                state: "closed"
              },
              repository: { full_name: $repo }
            }')

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.*= //')

          curl -s -X POST "$INGESTION_WEBHOOK_URL/github-webhook" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}-${{ github.run_attempt }}" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"
